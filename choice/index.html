<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>choice</title>
  <link rel="stylesheet" href="style.css">
</head>
<style>
    button:hover {
        background: #4f7a8f;
    }

    input:focus,
    textarea:focus {
        border-color: #2563eb;
        outline: 2px solid #2563eb;
    }

</style>
<body>
<div class="signup">
  <form>
    <label>
      Имя
      <input class="names" type="text" name="name" placeholder="Введите Имя" required>
    </label>
    <label>
      <input class="accept" type="checkbox" name="rules">
      Мне более 18 лет
    </label>
    <button class="click" type="submit">Отправить</button>
    <p class="answer"></p>
  </form>
</div>
<script src="script.js"></script>
</body>
</html>
