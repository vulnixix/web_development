<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Две галочки</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <form id="bothForm" novalidate>
    <label for="nameInput">Имя</label>
    <input type="text" id="nameInput" name="name" required placeholder="Введи имя">

    <fieldset>
      <legend>Отметь, если подходит (необязательно)</legend>

      <label class="check-row">
        <input type="checkbox" id="check1" name="check1">
        Люблю утренний кофе
      </label>

      <label class="check-row">
        <input type="checkbox" id="check2" name="check2">
        Гуляю перед сном
      </label>
    </fieldset>

    <button type="submit">Отправить</button>
  </form>

  <p id="result"></p>
</div>

<script src="script.js"></script>
</body>
</html>
