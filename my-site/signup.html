<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Регистрарция</title>
  <link rel="stylesheet" href="style.css">
</head>
<style>
    button:hover {
        background: #4f7a8f;
    }

    * {margin: 0; padding: 0; box-sizing: border-box;}

    input:focus,
    textarea:focus {
        border-color: #2563eb;
        outline: 2px solid #2563eb;
    }
</style>

<body>

<div class="head">
  <a href="index.html"><h2>Код будущего</h2></a>
  <a href="signup.html"><button class="button1">Записаться</button></a>
</div>

<div class="signup">
  <h1>Запись на курсы</h1>
  <p style="margin-top: 20px; margin-bottom: 20px">Напиши, как тебя зовут и чем хочешь заниматся.</p>
  <form>
    <label>
      Имя
      <input type="text" name="name" placeholder="Введите Имя" required>
    </label>
    <label>
      Почта
      <input type="email" name="email" placeholder="Введите электронную почту" required>
    </label>
    <label>
      Сообщение
      <textarea name="message" placeholder="На какой курс хотите записаться?" required></textarea>
    </label>
    <a href="index.html"><button class="button" type="submit">Отправить</button></a>
    <a style="color: #326527" href="index.html">На главную</a>
  </form>
</div>

</body>
</html>
